      - issues
    DetectReconciliationBreaksResult:
      type: object
      description: Returned by POST /reconciliation/breaks/compute.
      properties:
        transactions_checked:
          type: integer
          description: Transactions with a non-null reconciliation_status.
        confirmed_breaks:
          type: integer
          description: reconciliation_status == "BREAK" (source-flagged).
        provisional_variances:
          type: integer
          description: Not yet BREAK, but reconciliation_variance_amount is already
            nonzero -- an early-warning signal.
      required:
      - transactions_checked
      - confirmed_breaks
      - provisional_variances
    ReconciliationBreak:
      type: object
      description: One detected reconciliation problem. detection_type is CONFIRMED_BREAK
        (source already called it a break -- not every one carries a nonzero variance_amount,
        some are flagged for other reasons) or PROVISIONAL_VARIANCE (source hasn't
        called it a break yet, but the variance is already nonzero).
      properties:
        id:
          type: integer
        tenant_bank_id:
          type: string
        transaction_id:
          type: string
        rail_type:
          type: string
        detection_type:
          type: string
          enum:
          - CONFIRMED_BREAK
          - PROVISIONAL_VARIANCE
        source_reconciliation_status: *id002
        variance_amount: *id005
        amount: *id005
        details: *id003
        detected_at: *id004
      required:
      - id
      - tenant_bank_id
      - transaction_id
      - rail_type
      - detection_type
      - detected_at
    ReconciliationBreakList:
      type: object
      properties:
        total:
          type: integer
        breaks:
          type: array
          items:
            $ref: '#/components/schemas/ReconciliationBreak'
      required:
      - total
      - breaks
    DashboardOverview:
      type: object
      description: Returned by GET /dashboard/overview. A live read over the three
        engines' already-computed output -- nothing here is stored, nothing is an
        estimate.
      properties:
        total_transactions:
          type: integer
        settled_transactions:
          type: integer
        settlement_rate: *id005
        total_merchants:
          type: integer
        total_individuals:
          type: integer
        date_range_start:
          type: string
          nullable: true
          description: Earliest transaction_occurred_at for this tenant (ISO 8601),
            or null if no transactions have a timestamp.
        date_range_end:
          type: string
          nullable: true
          description: Latest transaction_occurred_at for this tenant (ISO 8601).
        anomaly_band_counts:
          type: object
          additionalProperties:
            type: integer
          example:
            Normal: 98
            Low-Medium: 68
            High: 6
            Critical: 2
        operational_issue_counts:
          type: object
          additionalProperties:
            type: integer
          example:
            DUPLICATE_PAYMENT: 18
            FORMAT_REJECTION: 19
        reconciliation_break_counts:
          type: object
          additionalProperties:
            type: integer
          example:
            CONFIRMED_BREAK: 30
            PROVISIONAL_VARIANCE: 3
      required:
      - total_transactions
      - settled_transactions
      - total_merchants
      - total_individuals
      - anomaly_band_counts
      - operational_issue_counts
      - reconciliation_break_counts
    DashboardRailStat:
      type: object
      properties:
        rail_type:
          type: string
          enum:
          - ACH
          - WIRE
          - CARD
          - FEDNOW
          - CHEQUE
          description: The platform's 5 real rails -- never RTP/SWIFT/CHIPS/Fedwire,
            which don't exist in this schema.
        transaction_count:
          type: integer
        settled_count:
          type: integer
        settlement_rate: *id005
        total_amount: *id005
        reconciliation_break_count:
          type: integer
      required:
      - rail_type
      - transaction_count
      - settled_count
      - reconciliation_break_count
    DashboardRails:
      type: object
      description: Returned by GET /dashboard/rails.
      properties:
        rails:
          type: array
          items:
            $ref: '#/components/schemas/DashboardRailStat'
      required:
      - rails
    AnomalyDetectionCategoryNode:
      type: object
      description: 'Recursive: a node may have `categories` (children) or not (a leaf).'
      properties:
        id:
          type: string
        code:
          type: string
          nullable: true
        title:
          type: string
        description:
          type: string
        categories:
          type: array
          items:
            $ref: '#/components/schemas/AnomalyDetectionCategoryNode'
      required:
      - id
      - title
      - description
    AnomalyDetectionCategories:
      type: object
      description: Returned by GET /dashboard/anomaly-detection-categories. Static
        -- documents what the platform detects and how, not a DB query. Read-only;
        no write-back endpoint exists.
      properties:
        title:
          type: string
        subtitle:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/AnomalyDetectionCategoryNode'
      required:
      - title
      - subtitle
      - items
    AgentNarrative:
      type: object
      description: A cached LLM narrative for one signal. Generated once per (signal_type,
        signal_id, tenant_bank_id) unless force=True was passed -- every field is
        either a literal fact from the source row or Mistral's narration of those
        facts (never a new fact the detection engines didn't already compute; see
        app/agent/narration.py's system prompt).
      properties:
        id:
          type: string
          description: '"{signal_type}:{tenant_bank_id}:{reference_id}"'
        signal_type:
          type: string
          enum:
          - operational_issue
          - reconciliation_break
          - fraud_anomaly
        reference_id:
          type: string
        tenant_bank_id:
          type: string
        title:
          type: string
        description:
          type: string
        recommended_action:
          type: object
          properties:
            title:
              type: string
            description:
              type: string
          required:
          - title
          - description
        model:
          type: string
          example: mistral-large-latest
        generated_at: *id004
      required:
      - id
      - signal_type
      - reference_id
      - tenant_bank_id
      - title
      - description
      - recommended_action
      - model
      - generated_at
    AgentNarrativeList:
      type: object
      properties:
        total:
          type: integer
        narratives:
          type: array
          items:
            $ref: '#/components/schemas/AgentNarrative'
      required:
      - total
      - narratives
servers:
- url: http://localhost:8000
  description: Local dev (uvicorn app.main:app --reload)
