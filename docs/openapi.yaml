openapi: 3.1.0
info:
  title: Merchant Payment Intelligence Platform
  version: 0.1.0
  description: 'Merchant Payment Intelligence Platform -- backend API for the frontend
    team.


    Covers Steps 1-5 (ingestion, identity resolution, feature store), the complete
    Fraud/Anomaly Detection engine (Step 6a): Track A (behavioral snapshots), Track
    B (Isolation Forest), Track C (time-series drift, including Funnel Account detection),
    Track D (HDBSCAN clustering), and the Section 8 final aggregation that combines
    all three model tracks into one final_anomaly_score/anomaly_band per entity --
    plus the complete Operational Issues engine (Step 6b, all four detectors: Duplicate
    Payment, Formatting Rejection, Batch Never Settles, Network/Processor Timeout)
    and the Reconciliation engine (Step 6c).


    All `/anomaly/*/compute` and `/resolve/parties` and `/features/compute` endpoints
    are POST, take an optional `{"tenant_bank_id": null}` body (omit or null = all
    tenants), and return a run-summary object, not the computed rows themselves --
    fetch those via the matching GET endpoint. Run them in dependency order for a
    fresh tenant: snapshots/compute -> isolation-forest/train + timeseries/compute
    + clustering/compute (any order) -> final-score/compute.'
  contact:
    name: Vishaal
    email: vishaal.g@tibilsolutions.com
