    EntitySnapshot:
      type: object
      description: Track A behavioral snapshot -- one row per (merchant, week) or
        one TO_DATE row per individual. isolation_forest_score/cluster_id/cluster_changed/timeseries_drift_score/final_anomaly_score/anomaly_band
        are null until the corresponding track has scored this row (Track B, D, C,
        and the final aggregation step, respectively).
      properties:
        id:
          type: integer
        party_id:
          type: string
        party_type:
          type: string
          enum:
          - MERCHANT
          - INDIVIDUAL
        tenant_bank_id:
          type: string
        segment:
          type: string
        window_type:
          type: string
          enum:
          - WEEKLY
          - TO_DATE
        window_start: *id006
        window_end: *id004
        transaction_count:
          type: integer
        amount_total: *id005
        amount_avg: *id005
        amount_median: *id005
        amount_std: *id005
        unique_counterparties: *id007
        new_counterparty_ratio: *id005
        retry_ratio: *id005
        avg_response_time_ms: *id005
        timeout_ratio: *id005
        format_reject_ratio: *id005
        rails_used: *id008
        account_age_days: *id005
        split:
          type: string
          enum:
          - train
          - test
        computed_at: *id004
        isolation_forest_score:
          type: number
          nullable: true
          description: 0-100, Track B
        cluster_id:
          type: integer
          nullable: true
          description: Track D
        cluster_changed:
          type: boolean
          nullable: true
          description: Track D
        timeseries_drift_score:
          type: number
          nullable: true
          description: 0-100, Track C
        final_anomaly_score:
          type: number
          nullable: true
          description: 0-100, aggregation step
        anomaly_band:
          type: string
          nullable: true
          enum:
          - Normal
          - Low-Medium
          - High
          - Critical
          - null
          description: Aggregation step
      required:
      - id
      - party_id
      - party_type
      - tenant_bank_id
      - segment
      - window_type
      - window_end
      - transaction_count
      - split
      - computed_at
