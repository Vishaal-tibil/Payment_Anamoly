components:
  schemas:
    Body_ingest_file_ingest_file_post:
      properties:
        tenant_bank_id:
          type: string
          title: Tenant Bank Id
        rail_type:
          type: string
          title: Rail Type
        settlement_stage:
          $ref: '#/components/schemas/SettlementStage'
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
      type: object
      required:
      - tenant_bank_id
      - rail_type
      - settlement_stage
      - file
      title: Body_ingest_file_ingest_file_post
    ClusterAndScoreRequest:
      properties:
        tenant_bank_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Tenant Bank Id
        include_structuring:
          type: boolean
          title: Include Structuring
          default: false
      type: object
      title: ClusterAndScoreRequest
    ComputeBeneficiarySnapshotsRequest:
      properties:
        tenant_bank_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Tenant Bank Id
      type: object
      title: ComputeBeneficiarySnapshotsRequest
    ComputeCasesRequest:
      properties:
        tenant_bank_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Tenant Bank Id
      type: object
      title: ComputeCasesRequest
    ComputeFeaturesRequest:
      properties:
        tenant_bank_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Tenant Bank Id
      type: object
      title: ComputeFeaturesRequest
    ComputeFinalScoreRequest:
      properties:
        tenant_bank_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Tenant Bank Id
      type: object
      title: ComputeFinalScoreRequest
    ComputeHealthRequest:
      properties:
        tenant_bank_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Tenant Bank Id
      type: object
      title: ComputeHealthRequest
    ComputeSnapshotsRequest:
      properties:
        tenant_bank_id:
          anyOf:
