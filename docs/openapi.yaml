        (deterministic, severity_score null) and NETWORK_TIMEOUT_SPIKE (0-100, z-score
        based).'
      properties:
        id:
          type: integer
        issue_type:
          type: string
          enum:
          - DUPLICATE_PAYMENT
          - FORMAT_REJECTION
          - FORMAT_REJECTION_SPIKE
          - NETWORK_TIMEOUT_SPIKE
          - BATCH_NOT_SETTLED
        tenant_bank_id:
          type: string
        reference_type:
          type: string
          enum:
          - TRANSACTION
          - BATCH
          - PARTY
        reference_id:
          type: string
          description: transaction_id, batch_id, or party_id depending on reference_type.
        window_start: *id006
        window_end: *id006
        severity_score: *id005
        details: *id003
        detected_at: *id004
      required:
      - id
      - issue_type
      - tenant_bank_id
      - reference_type
      - reference_id
      - detected_at
    OperationalIssueList:
      type: object
      properties:
        total:
          type: integer
        issues:
          type: array
          items:
            $ref: '#/components/schemas/OperationalIssue'
      required:
