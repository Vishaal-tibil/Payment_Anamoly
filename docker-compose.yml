# Convenience wrapper for running the backend the same way on a laptop and
# on EC2. `docker compose up -d --build` is the whole deploy.
#
# Everything environment-specific comes from a .env file next to this one
# (copy .env.example). Nothing secret is written here.

services:
  api:
    build: .
    image: payment-anomaly-api:latest
    container_name: payment-anomaly-api
    restart: unless-stopped
    ports:
      # Bind to localhost only and let nginx/ALB terminate TLS in front.
      # Change to "8000:8000" only if you intend the API to be publicly
      # reachable on :8000 with no TLS and no auth.
      - "127.0.0.1:8000:8000"
    environment:
      # Supplied at runtime, never baked into the image. Narration fails
      # with a clear error if absent; every other endpoint still works.
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      # Quota failover -- narration moves to the next key when one is
      # exhausted. Failover, not load balancing: the primary is preferred.
      MISTRAL_API_KEY_2: ${MISTRAL_API_KEY_2:-}
      MISTRAL_API_KEY_3: ${MISTRAL_API_KEY_3:-}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-mistral-large-latest}
      # Exact origins of the hosted frontend, comma-separated. When set,
      # the localhost dev regex is NOT also allowed (see app/config.py).
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
      DB_PATH: /data/payments.db
    volumes:
      # Named volume, not a bind mount: the database must outlive the
      # container. Losing it discards every ingested transaction, analyst
      # review and cached narrative.
      - payments-data:/data

volumes:
  payments-data:
